<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CF Trainer</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <cf-app></cf-app>

  <template id="tpl-app">
    <header class="app-header">
      <div class="brand">CF TRAINER</div>
      <div class="controls">
        <button id="btn-refresh" class="icon-btn" title="Refresh solved status">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-5.5-5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
            <path d="M8 0.4l3 2.1-3 2.1z" fill="currentColor"></path>
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="Settings"></button>
      </div>
    </header>

    <div id="add-banner" class="add-banner hidden"></div>

    <nav id="tab-bar" class="tab-bar">
      <button type="button" class="tab" data-view="cf-queue-view">Queue</button>
      <button type="button" class="tab" data-view="cf-contest-list">Contests</button>
      <button type="button" class="tab" data-view="cf-stats-view">Stats</button>
    </nav>

    <div id="sync-status" class="sync-status hidden"></div>
    <main id="router-outlet"></main>
  </template>

  <script type="module" src="./index.js"></script>
</body>

</html>
