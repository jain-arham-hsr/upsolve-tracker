<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upsolve Tracker</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <cf-app></cf-app>

  <template id="tpl-app">
    <header class="app-header">
      <div class="brand">UPSOLVE</div>
      <div class="controls">
        <button id="btn-refresh" class="icon-btn" title="Refresh solved status">
          <!-- The arrowhead is a stroked corner, not a filled triangle: at 16px the
               old triangle was 3px wide, sat outside the arc's end and read as a
               speck. This one is drawn at the same weight as the arc. -->
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"></path>
            <polyline points="23 4.5 23 10 17.5 10"></polyline>
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="Settings"></button>
      </div>
    </header>

    <div id="add-banner" class="add-banner hidden"></div>

    <nav id="tab-bar" class="tab-bar">
      <button type="button" class="tab" data-view="cf-queue-view">Queue</button>
      <button type="button" class="tab" data-view="cf-contest-list">Contests</button>
      <button type="button" class="tab" data-view="cf-stats-view">Stats</button>
    </nav>

    <div id="sync-status" class="sync-status hidden"></div>
    <main id="router-outlet"></main>
  </template>

  <script type="module" src="./index.js"></script>
</body>

</html>
