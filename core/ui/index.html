<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upsolve Tracker</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <upsolve-app></upsolve-app>

  <template id="tpl-app">
    <header class="app-header">
      <div class="brand">UPSOLVE</div>
      <div class="controls">
        <button id="btn-refresh" class="icon-btn" title="Refresh solved status">
          <!-- One filled path, not a stroke plus a separate head: the head is part
               of the same shape, so it seats on the arc's end at any size instead
               of floating beside it the way the previous two attempts did. Nearly
               a full turn, with the gap and the head both at the top. -->
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-8 8s3.57 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"></path>
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="Settings"></button>
      </div>
    </header>

    <div id="add-banner" class="add-banner hidden"></div>

    <nav id="tab-bar" class="tab-bar">
      <button type="button" class="tab" data-view="upsolve-queue-view">Queue</button>
      <button type="button" class="tab" data-view="upsolve-contest-list">Contests</button>
      <button type="button" class="tab" data-view="upsolve-stats-view">Stats</button>
    </nav>

    <!-- Shown instead of everything below the header while nobody is signed
         in. The extension is not usable signed out: the queue lives in the
         account, and every rating comes from the shared catalog. -->
    <section id="signin-gate" class="signin-gate hidden">
      <h2 class="signin-gate-title">Sign in to continue</h2>
      <p class="signin-gate-text">
        Upsolve Tracker keeps your queue in your Google account, so it survives
        clearing Chrome's data and follows you to any computer.
      </p>
      <!-- Filled by google-button.js: Google's branded button, logo and all. -->
      <button type="button" id="btn-signin"></button>
      <p id="signin-gate-status" class="signin-gate-status hidden"></p>
    </section>

    <div id="sync-status" class="sync-status hidden"></div>
    <main id="router-outlet"></main>
  </template>

  <script type="module" src="./index.js"></script>
</body>

</html>
