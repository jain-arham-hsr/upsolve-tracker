<div class="view-container">

  <div class="section-header list-header">
    <div class="header-title" style="margin: 0;">CONTEST QUEUE</div>
    <button id="btn-add-contest" class="btn outline">+ Add Contest</button>
  </div>

  <div class="list-toolbar">
    <label class="filter-label" for="contest-filter">Show</label>
    <select id="contest-filter" class="filter-select">
      <option value="ALL">All contests</option>
      <option value="OFFICIAL">Official only</option>
      <option value="GYM">Gym only</option>
    </select>
  </div>

  <div id="contest-alert" class="sync-alert hidden"></div>

  <div id="contest-items"></div>

  <div class="list-actions-footer">
    <input type="file" id="import-file-input" accept=".json" style="display: none;" />
    <button id="btn-import" class="btn-footer">⬇ Import</button>
    <button id="btn-export" class="btn-footer">⬆ Export</button>
  </div>

</div>
