<style>
  :host {
    display: block;
  }

  .fetching-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 0;
  }

  /* The Spinning Loader */
  .loader {
    width: 40px;
    height: 40px;
    /* Using fallbacks in case style.css isn't loaded yet */
    border: 4px solid var(--border-color, #333);
    border-top: 4px solid var(--accent-color, #007bff);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }

    100% {
      transform: rotate(360deg);
    }
  }

  .progress-text {
    color: var(--text-secondary, #999);
    font-size: 14px;
    margin-top: 16px;
    text-align: center;
    font-family: sans-serif;
  }
</style>

<link rel="stylesheet" href="style.css">

<div class="view-state fetching-container">
  <div class="loader"></div>
  <p id="fetch-progress-text" class="progress-text">Starting fetch...</p>
</div>
