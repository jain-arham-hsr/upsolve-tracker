<div class="view-container">

  <div class="view-meta">
    <span id="stats-summary"></span>
  </div>

  <div id="stats-nav"></div>

  <div id="stats-body">
    <div id="stats-hint" class="stats-hint hidden"></div>

    <section class="stats-section" id="ring-section">
      <div id="stats-ring"></div>
    </section>

    <section class="stats-section" id="tags-section">
      <div class="stats-section-title" id="tags-title">TAG FREQUENCY</div>

      <div id="tag-coverage" class="tag-range-caption"></div>

      <!-- Two native range inputs stacked, not a bespoke control: dragging is
           the point, but arrow keys still step one bucket at a time, which is
           what the old pair of selects was good at. -->
      <div id="tag-range" class="tag-range hidden">
        <div class="range-head">
          <span class="filter-label">Rating</span>
          <span class="range-values"><span id="range-value-min"></span>&ndash;<span id="range-value-max"></span></span>
        </div>
        <div class="range-slider">
          <span class="range-track"></span>
          <span class="range-fill" id="range-fill"></span>
          <input type="range" id="tag-range-min" class="range-input" aria-label="Lowest rating">
          <input type="range" id="tag-range-max" class="range-input" aria-label="Highest rating">
        </div>
      </div>

      <div id="tag-range-caption" class="tag-range-caption"></div>

      <div id="stats-tags"></div>
    </section>

    <section class="stats-section">
      <div class="stats-section-title" id="spread-title">RATING SPREAD</div>
      <div id="stats-histogram"></div>
    </section>
  </div>

</div>
